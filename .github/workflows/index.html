```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الخلاصة في الكيمياء | التحكم السحابي</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // إعدادات Firebase من البيئة
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'chem-platform-v4';

        const ADMIN_PASSWORD = "a";

        // وظيفة تسجيل الدخول
        window.checkLogin = async function() {
            const nameInput = document.getElementById('student-name').value.trim();
            if (!nameInput) {
                alert("يرجى إدخال الاسم");
                return;
            }

            try {
                await signInAnonymously(auth);
                document.getElementById('login-overlay').style.display = "none";
                document.getElementById('content-area').style.display = "block";
                document.getElementById('display-user-name').innerText = nameInput;

                if (nameInput === ADMIN_PASSWORD) {
                    document.body.classList.add('admin-mode');
                    document.getElementById('admin-indicator').style.display = "block";
                }

                // المزامنة اللحظية للبيانات
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings');
                onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        if (data.u4_link) document.getElementById('iframe-u4').src = data.u4_link;
                        if (data.u4_title) document.getElementById('title-u4').innerText = data.u4_title;
                        if (data.u5_link) document.getElementById('iframe-u5').src = data.u5_link;
                    }
                });
            } catch (err) {
                alert("خطأ في الاتصال بقاعدة البيانات");
            }
        };

        // وظيفة التعديل - تم ربطها بـ window لضمان عمل الزر
        window.openEditBox = async function(key, label) {
            // طلب الرابط أو العنوان من المعلم
            const newValue = prompt("أدخل " + label + " الجديد:");
            
            if (newValue !== null && newValue.trim() !== "") {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings');
                    // حفظ البيانات في السحابة فوراً
                    await setDoc(docRef, { [key]: newValue.trim() }, { merge: true });
                    alert("✅ تم الحفظ بنجاح! سيظهر التغيير لجميع الطلاب الآن.");
                } catch (e) {
                    alert("❌ فشل الحفظ السحابي: تأكد من الاتصال بالإنترنت");
                }
            }
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;700&display=swap');
        
        :root {
            --primary-orange: #d35400;
            --dark-orange: #a04000;
            --light-bg: #fdf2e9;
            --text-dark: #2e1503;
            --white: #ffffff;
        }

        body { font-family: 'Tajawal', sans-serif; background-color: var(--light-bg); margin: 0; direction: rtl; }
        
        /* شاشة الدخول */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--text-dark); z-index: 10000; display: flex; 
            align-items: center; justify-content: center;
        }
        .login-box { 
            background: white; padding: 2rem; border-radius: 20px; text-align: center; 
            width: 85%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        .login-box h2 { font-family: 'Cairo'; color: var(--primary-orange); margin: 0 0 10px 0; }
        .login-box input { 
            width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #ddd; 
            border-radius: 10px; box-sizing: border-box; text-align: center; font-size: 1rem;
        }
        .login-box button { 
            background: var(--primary-orange); color: white; border: none; 
            padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold;
        }

        /* المحتوى الرئيسي */
        header { background: linear-gradient(135deg, var(--dark-orange), #873600); color: white; padding: 2rem; text-align: center; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        
        .unit-card { background: white; padding: 1.5rem; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 15px; background: #000; margin-top: 15px; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* أزرار المعلم */
        .admin-controls { 
            display: none; background: #fff3e0; padding: 15px; margin-top: 15px; 
            border-radius: 12px; border: 2px dashed var(--primary-orange); text-align: center;
        }
        .admin-mode .admin-controls { display: block; }
        .admin-btn { 
            background: var(--text-dark); color: white; border: none; 
            padding: 10px 20px; border-radius: 8px; cursor: pointer; margin: 5px; font-weight: bold;
        }
        .admin-btn:hover { background: var(--primary-orange); }

        .updates-bar { background: #f1c40f; color: #000; padding: 10px; overflow: hidden; font-weight: bold; }
        .marquee { white-space: nowrap; animation: marquee-anim 20s linear infinite; display: inline-block; padding-left: 100%; }
        @keyframes marquee-anim { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2>منصة الخلاصة</h2>
        <input type="text" id="student-name" placeholder="ادخل الاسم أو الرمز">
        <button onclick="window.checkLogin()">دخول</button>
    </div>
</div>

<div id="content-area" style="display:none;">
    <div class="updates-bar">
        <div class="marquee">📢 أهلاً بك يا <span id="display-user-name"></span>.. أي تعديل يقوم به المعلم يظهر لك هنا فوراً.</div>
    </div>

    <header>
        <h1 style="font-family:Cairo; margin:0">الخلاصة في الكيمياء</h1>
        <p id="admin-indicator" style="display:none; color: #f1c40f; font-weight: bold; margin-top: 10px;">🛠️ وضع المعلم نشط (تعديلاتك سحابية للجميع)</p>
    </header>

    <div class="container">
        <!-- الوحدة 4 -->
        <div class="unit-card">
            <h3 id="title-u4" style="font-family:Cairo; color: var(--dark-orange)">الوحدة 4: سرعة التفاعل ورتبته</h3>
            <div class="video-wrapper">
                <iframe id="iframe-u4" src="about:blank"></iframe>
            </div>
            
            <div class="admin-controls">
                <button class="admin-btn" onclick="window.openEditBox('u4_link', 'رابط الفيديو')">🎥 تغيير الرابط</button>
                <button class="admin-btn" onclick="window.openEditBox('u4_title', 'عنوان الوحدة')">📝 تغيير العنوان</button>
            </div>
        </div>

        <!-- الوحدة 5 -->
        <div class="unit-card">
            <h3 id="title-u5" style="font-family:Cairo; color: var(--dark-orange)">الوحدة 5: الاتزان الكيميائي</h3>
            <div class="video-wrapper">
                <iframe id="iframe-u5" src="about:blank"></iframe>
            </div>
            
            <div class="admin-controls">
                <button class="admin-btn" onclick="window.openEditBox('u5_link', 'رابط الفيديو للوحدة 5')">🎥 تغيير الرابط</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
